# Fly.io configuration for the Orelle Phoenix release.
#
# Run migrations on every deploy (release_command), bind to an HTTP service
# on Fly's internal port 4000, and let Fly's edge proxy terminate TLS for
# us. The libsql replica file lives at /tmp/to_do.db (ephemeral; resyncs
# from Turso on boot), so no volumes are mounted.

app = "orelle"
primary_region = "lhr"

[build]

[deploy]
  # Blue-green: start the new machine, wait for its health check, only
  # then retire the old one. The default rolling strategy stops the
  # single machine first, which leaves a window where the browser's
  # WebSocket can't reconnect — LiveView then falls back to long-polling
  # and remembers that for the rest of the tab session.
  strategy = "bluegreen"
  # release_command is intentionally not set. The Fly release-machine boots
  # faster than Fly's internal IPv6 networking, so Postgrex consistently
  # fails to reach orelle-db on first attempt. Migrations are run manually
  # via `flyctl ssh console -a orelle --command "/app/bin/migrate"` after
  # any deploy that adds new ones. Most deploys add no migrations.

[env]
  PHX_HOST = "orelle.app"
  PORT = "4000"

[http_service]
  internal_port = 4000
  force_https = true
  # Always-on. Avoids cold-start latency for the private beta; cost is
  # ~$2-3/mo for one shared-cpu-1x machine.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/"
    protocol = "http"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
